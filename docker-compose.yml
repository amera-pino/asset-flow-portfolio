services:
  db:
    # restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetflow}
      POSTGRES_USER: ${POSTGRES_USER:-assetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetflow_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assetflow} -d ${POSTGRES_DB:-assetflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # restart: always
    build:
      context: ./backend
    working_dir: /workspace/backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://assetflow:assetflow_password@db:5432/assetflow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend-integration:
    build:
      context: ./backend
    working_dir: /workspace/backend
    environment:
      APP_ENV: dev
      LOG_TO_FILE: false
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8001:8000"
    volumes:
      - .:/workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    profiles:
      - integration-test

  frontend:
    # restart: always
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
