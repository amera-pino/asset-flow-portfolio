name: CI

on:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

  frontend-unit:
    name: Frontend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  frontend-integration:
    name: Frontend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start integration backend
        working-directory: .
        run: docker compose --profile integration-test up -d --build backend-integration

      - name: Run integration tests
        env:
          INTEGRATION_MANAGED_SERVICES: "false"
        run: npm run test:integration

      - name: Show integration backend logs on failure
        if: failure()
        working-directory: .
        run: docker compose --profile integration-test logs --no-color backend-integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker Compose services
        working-directory: .
        env:
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: docker compose up -d db backend

      - name: Start frontend dev server
        env:
          PLAYWRIGHT_BACKEND_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8000
        run: nohup npm run dev -- --host localhost --strictPort > /tmp/assetflow-frontend.log 2>&1 &

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_BACKEND_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_MANAGED_SERVICES: "false"
        run: npm run e2e

      - name: Show Docker Compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color db backend

      - name: Show frontend dev log on failure
        if: failure()
        run: cat /tmp/assetflow-frontend.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
